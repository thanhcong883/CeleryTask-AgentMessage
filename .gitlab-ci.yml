include:
  - project: 'devops/cicd'
    ref: 'master'
    file: 'base/remove-img-old.yml'
###### List stages #######

stages:
  - build
  - replace
  - notify_success
  - notify_failure
  - remove_image_old

########template build #######

.build_template:
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.celery.latest || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.celery.latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery -t $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.celery.latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.celery.latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery
  after_script:
    - docker rmi $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.celery.latest
    - docker rmi $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery
    - docker rmi $(docker images -f "dangling=true" -q) || true

.replace_template:
  variables:
    VALUE_PATH_WEB: chart-core/celery-message/values.yaml
    VALUE_PATH_AGENT: chart-core/celery-message/charts/celery-agent/values.yaml
    VALUE_PATH_BEAT: chart-core/celery-message/charts/celery-beat/values.yaml
    VALUE_PATH_SEND: chart-core/celery-message/charts/celery-send/values.yaml
    VALUE_PATH_RECIVE: chart-core/celery-message/charts/celery-recive/values.yaml
    VALUE_PATH_FLOWER: chart-core/celery-message/charts/celery-flower/values.yaml
    TAG_PATH: .image.tag
  image: alpine:latest
  before_script:
    - apk update
    - apk add git yq
    - git clone https://$GIT_USER:$CI_PRIVATE_TOKEN@gitlab.evgcorp.net/devops/helm/chart-support-ai-prod.git
    - cd chart-support-ai-prod
    - git remote set-url origin "https://$GIT_USER:$CI_PRIVATE_TOKEN@gitlab.evgcorp.net/devops/helm/chart-support-ai-prod.git"
    # Configure git user
    - git config --global user.email "van.le@evgcorp.net"
    - git config --global user.name "GitLab CI by Van"
    # Reset to remote prod branch
    - git fetch
    - git checkout main
    - git reset --hard origin/main
  script:
    # Update YAML file
    - yq -i "$TAG_PATH = \"$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery\"" $VALUE_PATH_WEB
    - yq -i "$TAG_PATH = \"$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery\"" $VALUE_PATH_AGENT
    - yq -i "$TAG_PATH = \"$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery\"" $VALUE_PATH_BEAT
    - yq -i "$TAG_PATH = \"$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery\"" $VALUE_PATH_SEND
    - yq -i "$TAG_PATH = \"$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery\"" $VALUE_PATH_RECIVE
    - yq -i "$TAG_PATH = \"$CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery\"" $VALUE_PATH_FLOWER
    - git add $VALUE_PATH_WEB
    - git add $VALUE_PATH_AGENT
    - git add $VALUE_PATH_BEAT
    - git add $VALUE_PATH_SEND
    - git add $VALUE_PATH_RECIVE
    - git add $VALUE_PATH_FLOWER
    - git commit -m "CI Deploy $TAG_PATH to $CI_COMMIT_BRANCH.$CI_COMMIT_SHORT_SHA.celery"
    - git push -o ci.skip origin HEAD:main

.notify_success_template:
  image: alpine
  stage: notify_success
  before_script:
    - apk add --no-cache curl jq
  variables:
    CHAT_ID: "-4916051911"
    TOKEN_BOT: "8249105997:AAGkbkMTPZlGrMJ5Sukg1aPtDgZu7bSbIjU"
  script:
    - |
      curl -X POST "https://api.telegram.org/bot$TOKEN_BOT/sendMessage" \
      -H "Content-Type: application/json" \
      -d "{
        \"chat_id\": \"$CHAT_ID\",
        \"text\": \"✅ *${CI_PROJECT_NAME}* build succeed\n*Branch:* ${CI_COMMIT_REF_NAME}\n*Commit:* ${CI_COMMIT_MESSAGE}\",
        \"parse_mode\": \"Markdown\" }"

.notify_failure_template:
  image: alpine
  stage: notify_failure
  before_script:
    - apk add --no-cache curl jq
  variables:
    CHAT_ID: "-4916051911"
    TOKEN_BOT: "8249105997:AAGkbkMTPZlGrMJ5Sukg1aPtDgZu7bSbIjU"
  script:
    - |
      curl -X POST "https://api.telegram.org/bot$TOKEN_BOT/sendMessage" \
      -H "Content-Type: application/json" \
      -d "{
        \"chat_id\": \"$CHAT_ID\",
        \"text\": \"❌ *${CI_PROJECT_NAME}* build failed\n*Branch:* ${CI_COMMIT_REF_NAME}\n*Commit:* ${CI_COMMIT_MESSAGE}\",
        \"parse_mode\": \"Markdown\" }"

######### job build #########

build_image:
  stage: build
  extends: .build_template
  only:
    - main
  tags:
    - evg

replace-tag-image:
  needs:
    - build_image
  stage: replace
  extends: .replace_template
  only:
    - main
  tags:
    - evg


prune_img_old:
  stage: remove_image_old
  extends:
    - .remove-img
  environment:
    name: dev
  variables:
    GITOPS_SECRET: huyabc321
    GITOPS: http://img-old-delete-img-old.argocd/delete
  only:
    - main
  tags:
    - k8s-dev


notify_success:
  extends: .notify_success_template
  when: on_success
  only:
    - main
  tags:
    - evg


notify_failure:
  extends: .notify_failure_template
  when: on_failure
  allow_failure: false
  only:
    - main
  tags:
    - evg
